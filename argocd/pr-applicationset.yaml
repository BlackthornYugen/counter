apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: counter-prs
  namespace: argocd
spec:
  generators:
    - pullRequest:
        gitea:
          owner: webapps
          repo: counter
          api: https://git.tower.jskw.dev/
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'counter-pr-{{number}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: 'https://git.tower.jskw.dev/webapps/counter.git'
        targetRevision: '{{head_sha}}'
        path: chart
        helm:
          parameters:
            - name: image.tag
              value: '{{head_sha}}'
            - name: ingress.enabled
              value: "true"
            - name: image.repository
              value: git.tower.jskw.dev/webapps/counter
            - name: ingress.hosts[0]
              value: 'pr-{{number}}-counter.jskw.dev'
      destination:
        server: https://kubernetes.default.svc
        namespace: gitea
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
