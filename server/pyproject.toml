[project]
name = "counter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "prometheus-client>=0.21.0",
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
